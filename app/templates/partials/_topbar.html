<header class="dashboard-topbar">
    <div class="topbar-left">
        <button class="btn topbar-toggle d-lg-none" id="sidebarToggle" aria-label="Open menu">
            <i class="bi bi-list"></i>
        </button>
        <div class="topbar-heading">
            <h1 class="topbar-title">{% block page_title %}Dashboard{% endblock %}</h1>
            <p class="topbar-subtitle">{% block page_subtitle %}Overview of your hiring pipeline{% endblock %}</p>
        </div>
    </div>

    <div class="topbar-right">

        <form class="topbar-search d-none d-md-flex" method="GET" action="{{ url_for('main.candidates') }}">
            <i class="bi bi-search"></i>
            <input type="search" name="q" class="form-control" placeholder="Search candidates, jobs, skills..." value="{{ request.args.get('q', '') }}">
        </form>

        <button class="btn topbar-user-btn" id="themeToggle" aria-label="Toggle theme" style="margin-right: 0.5rem;">
            <i class="bi bi-sun-fill" id="themeIcon"></i>
        </button>

        <div class="dropdown">
            <button class="btn topbar-user-btn" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="topbar-avatar">{{ current_user.full_name[0] | upper }}</div>
                <span class="d-none d-sm-inline">{{ current_user.full_name }}</span>
                <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                <li><span class="dropdown-item-text text-muted small">{{ current_user.email }}</span></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('auth.logout') }}">
                        <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
