<aside class="dashboard-sidebar" id="dashboardSidebar">
    <div class="sidebar-header">
        <a href="{{ url_for('main.dashboard') }}" class="sidebar-brand">
            <i class="bi bi-person-badge-fill"></i>
            <span>{{ app_name }}</span>
        </a>
        <button class="btn sidebar-close d-lg-none" id="sidebarClose" aria-label="Close menu">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <nav class="sidebar-nav">
        <span class="sidebar-section-label">Main</span>
        <ul class="nav flex-column">
            {% for item in nav_items %}
            <li class="nav-item">
                <a href="{{ url_for(item.endpoint) }}"
                   class="nav-link {{ 'active' if active_nav == item.id else '' }}">
                    <i class="bi {{ item.icon }}"></i>
                    <span>{{ item.label }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-user-avatar">
                {{ current_user.full_name[0] | upper }}
            </div>
            <div class="sidebar-user-info">
                <span class="sidebar-user-name">{{ current_user.full_name }}</span>
                <span class="sidebar-user-role">{{ current_user.role | capitalize }}</span>
            </div>
        </div>
        <a href="{{ url_for('auth.logout') }}" class="sidebar-logout">
            <i class="bi bi-box-arrow-right"></i> Sign Out
        </a>
    </div>
</aside>
