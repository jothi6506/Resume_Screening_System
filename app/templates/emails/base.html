<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: #333333;
        margin: 0;
        padding: 0;
        background-color: #f4f7f6;
    }
    .wrapper {
        width: 100%;
        background-color: #f4f7f6;
        padding: 40px 0;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .header {
        background: #ffffff;
        padding: 25px 30px;
        text-align: center;
        border-bottom: 2px solid #f0f2f5;
    }
    .logo {
        font-size: 24px;
        font-weight: 700;
        color: #1a1a1a;
        margin: 0;
        letter-spacing: -0.5px;
    }
    .logo-accent {
        color: #4361ee;
    }
    .title-section {
        background: #4361ee;
        color: #ffffff;
        padding: 30px;
        text-align: center;
    }
    .title-section h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .content {
        padding: 40px 30px;
        font-size: 16px;
        color: #4a4a4a;
    }
    .greeting {
        font-size: 20px;
        color: #1a1a1a;
        margin-top: 0;
        margin-bottom: 20px;
        font-weight: 600;
    }
    .content p {
        margin-bottom: 20px;
        line-height: 1.6;
    }
    .footer {
        background: #f8f9fa;
        padding: 30px;
        text-align: center;
        font-size: 13px;
        color: #888888;
        border-top: 1px solid #e9ecef;
    }
    .footer p {
        margin: 5px 0;
    }
    .divider {
        height: 1px;
        background-color: #e9ecef;
        margin: 30px 0;
    }
    @media only screen and (max-width: 600px) {
        .wrapper { padding: 20px 10px; }
        .content { padding: 30px 20px; }
        .title-section { padding: 20px; }
        .title-section h1 { font-size: 20px; }
    }
</style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <div class="logo">ResumeScreen <span class="logo-accent">AI</span></div>
            </div>
            
            {% block title_section %}{% endblock %}
            
            <div class="content">
                <div class="greeting">Dear {{ candidate.full_name }},</div>
                
                {% block content %}{% endblock %}
                
                <div class="divider"></div>
                
                <p style="margin-bottom: 5px;">Best Regards,</p>
                <p style="font-weight: 600; color: #1a1a1a; margin-top: 0;">HR Team<br><span style="color: #4361ee;">{{ app_name }}</span></p>
            </div>
            
            <div class="footer">
                <p>This is an automated email. Please do not reply.</p>
                <p>&copy; {{ current_date }} {{ app_name }}. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>
</html>
